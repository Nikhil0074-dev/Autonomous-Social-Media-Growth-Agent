<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px system-ui, sans-serif; width: 340px; margin: 12px; }
    select, button, input { width: 100%; margin: 4px 0; padding: 6px; box-sizing: border-box; }
    pre { white-space: pre-wrap; background: #f3f4f6; padding: 8px; max-height: 140px; overflow: auto; }
    .note { color: #555; font-size: 12px; }
    #status { margin-top: 8px; font-weight: 600; }
  </style>
</head>
<body>
  <strong>Ready-to-publish posts</strong>
  <input id="api" value="http://127.0.0.1:8000" title="Local API address">
  <button id="reload">Load posts</button>
  <select id="posts"></select>
  <pre id="preview"></pre>
  <button id="fill">Fill the post box on this tab</button>
  <div id="status"></div>
  <p class="note">Open the LinkedIn or X composer first. You check the text, attach the image,
  and press Post yourself. For X threads only post 1 is filled; copy the other posts from the dashboard.</p>
  <script src="popup.js"></script>
</body>
</html>
